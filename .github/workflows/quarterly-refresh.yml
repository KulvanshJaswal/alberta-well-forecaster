name: Quarterly Data Refresh

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

jobs:
  refresh-st37:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: ./backend
        run: pip install -r requirements.txt
      - working-directory: ./backend
        run: python ingestion/load_st37.py

  refresh-petrinex:
    runs-on: ubuntu-latest
    needs: refresh-st37
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: ./backend
        run: pip install -r requirements.txt
      - working-directory: ./backend
        run: python ingestion/load_petrinex.py